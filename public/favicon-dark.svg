<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bracket-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"></stop>
      <stop offset="100%" stop-color="#ec4899"></stop>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#1c1917"></rect>

  <g fill="none" stroke="url(#bracket-dark)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 20 L12 32 L22 44">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 3 0; 0 0"
        keyTimes="0; 0.5; 1"
        dur="3.2s"
        repeatCount="indefinite"></animateTransform>
    </path>
    <path d="M42 20 L52 32 L42 44">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; -3 0; 0 0"
        keyTimes="0; 0.5; 1"
        dur="3.2s"
        repeatCount="indefinite"></animateTransform>
    </path>
  </g>

  <rect x="30" y="24" width="4" height="16" rx="1" fill="#f5f5f4">
    <animate
      attributeName="opacity"
      values="1; 1; 0; 0"
      keyTimes="0; 0.5; 0.5; 1"
      dur="1.1s"
      repeatCount="indefinite"></animate>
  </rect>
</svg>
