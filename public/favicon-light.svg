<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bracket-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"></stop>
      <stop offset="100%" stop-color="#db2777"></stop>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="13" fill="#fafaf9" stroke="#e7e5e4" stroke-width="2"></rect>

  <g fill="none" stroke="url(#bracket-light)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 20 L12 32 L22 44">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 3 0; 0 0"
        keyTimes="0; 0.5; 1"
        dur="3.2s"
        repeatCount="indefinite"></animateTransform>
    </path>
    <path d="M42 20 L52 32 L42 44">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; -3 0; 0 0"
        keyTimes="0; 0.5; 1"
        dur="3.2s"
        repeatCount="indefinite"></animateTransform>
    </path>
  </g>

  <rect x="30" y="24" width="4" height="16" rx="1" fill="#292524">
    <animate
      attributeName="opacity"
      values="1; 1; 0; 0"
      keyTimes="0; 0.5; 0.5; 1"
      dur="1.1s"
      repeatCount="indefinite"></animate>
  </rect>
</svg>
