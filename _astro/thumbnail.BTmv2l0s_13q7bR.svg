<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="My Journey into Web Development: HTML, CSS and JavaScript">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"></stop>
      <stop offset="100%" stop-color="#ec4899"></stop>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1917"></stop>
      <stop offset="100%" stop-color="#292524"></stop>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="100%" stop-color="#f5f5f4"></stop>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.55"></stop>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.45"></stop>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"></stop>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"></rect>
  <circle cx="150" cy="520" r="320" fill="url(#glowA)"></circle>
  <circle cx="1050" cy="90" r="280" fill="url(#glowB)"></circle>

  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="80" y="220" font-size="26" font-weight="600" letter-spacing="6" fill="#a8a29e">LEARNING JOURNEY</text>
    <text x="80" y="300" font-size="64" font-weight="700" fill="#ffffff">My Journey into</text>
    <text x="80" y="374" font-size="64" font-weight="700" fill="#ffffff">Web Development</text>
    <rect x="80" y="410" width="180" height="6" rx="3" fill="url(#brand)"></rect>
    <text x="80" y="474" font-size="30" font-weight="600" fill="#f5f5f4">HTML</text>
    <text x="170" y="474" font-size="30" font-weight="600" fill="#6366f1">→</text>
    <text x="225" y="474" font-size="30" font-weight="600" fill="#f5f5f4">CSS</text>
    <text x="305" y="474" font-size="30" font-weight="600" fill="#ec4899">→</text>
    <text x="360" y="474" font-size="30" font-weight="600" fill="#f5f5f4">JavaScript</text>
  </g>

  <g>
    <rect x="650" y="110" width="470" height="410" rx="18" fill="url(#screen)"></rect>
    <rect x="650" y="110" width="470" height="52" rx="18" fill="#e7e5e4"></rect>
    <rect x="650" y="144" width="470" height="18" fill="#e7e5e4"></rect>
    <circle cx="682" cy="136" r="8" fill="#f87171"></circle>
    <circle cx="710" cy="136" r="8" fill="#fbbf24"></circle>
    <circle cx="738" cy="136" r="8" fill="#34d399"></circle>

    <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
      <text x="686" y="212" fill="#6366f1">&lt;html&gt;</text>
      <text x="710" y="250" fill="#ec4899">&lt;head&gt;</text>
      <text x="734" y="288" fill="#a8a29e">&lt;title&gt;My first site&lt;/title&gt;</text>
      <text x="710" y="326" fill="#ec4899">&lt;/head&gt;</text>
      <text x="710" y="364" fill="#f59e0b">body { color: #1c1917 }</text>
      <text x="710" y="402" fill="#10b981">document.add(</text>
      <text x="710" y="440" fill="#a8a29e">console.log("hello web")</text>
      <text x="686" y="478" fill="#6366f1">&lt;/html&gt;</text>
    </g>
  </g>
</svg>
