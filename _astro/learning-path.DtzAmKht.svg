<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Learning path: HTML for structure, CSS for styling, JavaScript for behaviour">
  <rect width="1200" height="520" rx="20" fill="#fafaf9"></rect>

  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="600" y="72" text-anchor="middle" font-size="30" font-weight="700" fill="#1c1917">The path I followed</text>
    <text x="600" y="112" text-anchor="middle" font-size="20" fill="#78716c">Structure → Style → Behaviour</text>
  </g>

  <g>
    <rect x="70" y="170" width="300" height="230" rx="18" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"></rect>
    <rect x="450" y="170" width="300" height="230" rx="18" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"></rect>
    <rect x="830" y="170" width="300" height="230" rx="18" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"></rect>
  </g>

  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <text x="220" y="240" font-size="44" font-weight="700" fill="#e34c26">HTML</text>
    <text x="220" y="286" font-size="22" font-weight="600" fill="#1c1917">Structure</text>
    <text x="220" y="326" font-size="18" fill="#78716c">Headings, text, links,</text>
    <text x="220" y="354" font-size="18" fill="#78716c">images and forms</text>

    <text x="600" y="240" font-size="44" font-weight="700" fill="#2965f1">CSS</text>
    <text x="600" y="286" font-size="22" font-weight="600" fill="#1c1917">Style</text>
    <text x="600" y="326" font-size="18" fill="#78716c">Colour, spacing, layout,</text>
    <text x="600" y="354" font-size="18" fill="#78716c">responsive design</text>

    <text x="980" y="240" font-size="44" font-weight="700" fill="#b89400">JS</text>
    <text x="980" y="286" font-size="22" font-weight="600" fill="#1c1917">Behaviour</text>
    <text x="980" y="326" font-size="18" fill="#78716c">DOM, events, APIs</text>
    <text x="980" y="354" font-size="18" fill="#78716c">and interactivity</text>
  </g>

  <g fill="none" stroke="#a8a29e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M386 285 H424"></path>
    <polyline points="412,271 426,285 412,299"></polyline>
    <path d="M766 285 H804"></path>
    <polyline points="792,271 806,285 792,299"></polyline>
  </g>

  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <rect x="360" y="436" width="480" height="44" rx="22" fill="#1c1917"></rect>
    <text x="600" y="465" font-size="20" fill="#f5f5f4">Then: Git, projects and a portfolio</text>
  </g>
</svg>
